name: miccorag

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miccorag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: miccorag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U miccorag -d miccorag']
      interval: 5s
      timeout: 5s
      retries: 20

  chromadb:
    # Same verified server digest as the current deployment; Rust server uses /data.
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    restart: unless-stopped
    volumes:
      - chroma_data:/data

  backend:
    image: miccorag-backend:${MICCO_IMAGE_TAG:-local}
    build:
      context: ./micco-backend
      dockerfile: Dockerfile.backend
      args:
        VCS_REF: ${MICCO_VCS_REF:-unknown}
    restart: unless-stopped
    init: true
    env_file:
      - ${MICCO_ENV_FILE:-.env.docker}
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: '8000'
      DEBUG: 'false'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.docker}
      COMPAT_ENABLE_OPEN_REGISTRATION: 'false'
      COMPAT_ENABLE_LEGACY_ROUTES: 'true'
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - uploads:/app/backend/uploads
      - backend_data:/app/backend/data
      - model_cache:/home/micco/.cache
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/ready", timeout=5)']
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 12
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: miccorag-frontend:${MICCO_IMAGE_TAG:-local}
    build:
      context: ./micco-frontend
      args:
        VCS_REF: ${MICCO_VCS_REF:-unknown}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${MICCO_BIND_ADDRESS:-127.0.0.1}:${MICCO_HTTP_PORT:-18890}:8080'
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  chroma_data:
  uploads:
  backend_data:
  model_cache:
