[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for RAG Chatbot and Document Q&A"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic[email]>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pgvector",
  "chromadb",
  "openai>=1.0",
  "google-generativeai",
  "langchain-text-splitters",
  "pymupdf",
  "python-docx",
  "pytest",
  "pytest-asyncio",
  "pytest-mock",
  "httpx",
  "tenacity",
  "python-jose[cryptography]",
  "passlib"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
