services:
  nginx:
    image: nginx:alpine
    container_name: micco-nginx-gw
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Connect to the host network to access backend/frontend on localhost
    # Or you can put them in the same docker network
    network_mode: "host"

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: micco-duckdns-updater
    network_mode: "host" # Use host network to get the correct public IP
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN:-micco}
      # Bắt buộc đặt DUCKDNS_TOKEN trong .env (đã gitignore). Trước đây token
      # thật bị hardcode làm giá trị mặc định ở đây và đã lọt vào lịch sử git
      # -> token cũ coi như lộ, phải xoay lại trên duckdns.org.
      - TOKEN=${DUCKDNS_TOKEN:?DUCKDNS_TOKEN chua duoc dat trong .env}
      - LOG_FILE=false # set to true if you want to log to a file
    restart: unless-stopped
